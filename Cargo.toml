[package]
name = "number-detector"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
machine-learning = { path = "../machine-learning" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json ="1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "0.12.0", features = ["tower", "runtime", "tailwind"] }
tower-http = { version = "0.7.1", features = [ "fs" ] } 

[build-dependencies]
topcoat = { version = "0.12.0", default-features = false, features = ["tailwind"] }